name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build extension packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Check
        run: npm run check

      - name: Package
        run: npm run package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superepo-release
          path: dist/*.zip
          retention-days: 90

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags are released in the order v0.1.0-alpha, then -beta, then the
          # bare stable v0.1.0. Only the last is a real release, and GitHub will
          # not work that out on its own — it published v0.1.0-alpha as "Latest"
          # until the flag was set by hand. A hyphen after the version is the
          # semver pre-release marker, so v0.1.0 and v0.1.0 stay stable while
          # anything with -alpha or -beta in it is flagged.
          prerelease: ${{ contains(github.ref_name, '-') }}
