name: Catalog probe

# The catalog is a list of other people's URLs, and the graveyard in SERVICES.md
# is the record of what happens when nobody checks. This runs it on a schedule
# rather than on a push, because the thing it watches decays on its own clock.
#
# A failure here means a service in the catalog is unreachable — not that this
# repository is broken.

on:
  schedule:
    # Sunday 06:17 UTC. Deliberately not on the hour: every scheduled workflow
    # on the platform fires at :00 and the queue is worst then.
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      strict:
        description: "Also fail on HTTP errors, not just unreachable hosts"
        type: boolean
        default: false

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe every service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe
        run: node scripts/probe.mjs --out probe-report.json ${{ inputs.strict && '--strict' || '' }}

      - name: Show the table
        if: always()
        run: node scripts/probe.mjs || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report
          path: probe-report.json
          retention-days: 30