name: Catalog probe

# The catalog is a list of other people's URLs, and the graveyard in SERVICES.md
# is the record of what happens when nobody checks. This runs it on a schedule
# rather than on a push, because the thing it watches decays on its own clock.
#
# This is also the only place it runs. The push gate used to run it as well,
# which meant a service having a slow afternoon could turn main red for a reason
# that had nothing to do with this repository.
#
# A failure here means a service in the catalog is unreachable, not that anything
# is wrong with the extension. Whatever the outcome, the refreshed report and the
# regenerated docs/CATALOG.md are committed, so the "last probed" date the page
# publishes cannot quietly stop moving.

on:
  schedule:
    # Sunday 06:17 UTC. Deliberately not on the hour: every scheduled workflow
    # on the platform fires at :00 and the queue is worst then.
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      strict:
        description: "Also fail on HTTP errors, not just unreachable hosts"
        type: boolean
        default: false

concurrency:
  group: probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    name: Probe every service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The exit code is the signal here, not a reason to skip the report: the
      # run that matters most is the one that found something dead. The table it
      # prints to stdout is the human-readable half.
      - name: Probe
        id: probe
        continue-on-error: true
        run: node scripts/probe.mjs --out probe-report.json ${{ inputs.strict && '--strict' || '' }}

      - name: Regenerate the published catalog
        run: npm run catalog

      - name: Publish the refreshed report
        if: always()
        run: |
          if git diff --quiet -- probe-report.json docs/CATALOG.md; then
            echo "Report unchanged."
            exit 0
          fi
          git config user.name "Ranjith Raj"
          git config user.email "ranjithraj@riseup.net"
          git add probe-report.json docs/CATALOG.md
          git commit -m "Refresh the catalog probe report"
          git push

      - name: Fail if a service is unreachable
        if: steps.probe.outcome == 'failure'
        run: exit 1
