name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref; a new push supersedes an in-flight one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic, no network. This is the gate that has to be green.
  gate:
    name: Gate — test, check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      # Includes the check that PARTNERS.md's service table still matches
      # src/catalog.js, and that no manifest permission has crept in.
      - name: Manifest, catalog-drift and permission check
        run: npm run check

      - name: Catalog reachability (probe)
        run: npm run probe

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: superepo-dist
          path: dist/
          retention-days: 7

  # The only check that loads the built extension into a real browser. It also
  # reaches github.com, so unlike `gate` it can fail for reasons that have
  # nothing to do with this repository — a re-run is the first thing to try.
  smoke:
    name: Smoke — headless Chromium, real repo page
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: browser-actions/setup-chromium@v1

      - name: Build
        run: npm run build

      - name: Smoke
        run: npm run smoke